{% extends "base.html" %}

{% block title %}Entrar // ProtejaJá{% endblock %}

{% block content %}
<section class="w-full max-w-md mx-auto py-10">
    <div class="card-cyber">
        <div class="text-center mb-6">
            <span class="badge-neon-pink mb-2">Acesso à Conta</span>
            <h1 class="text-2xl font-extrabold text-white">Entrar</h1>
            <p class="text-xs text-slate-400 mt-1">Insira seu e-mail e senha para gerenciar suas denúncias.</p>
        </div>

        <form method="POST" action="/login" class="space-y-4" aria-describedby="legendaObrigatoriosLogin">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <p id="legendaObrigatoriosLogin" class="text-xs text-slate-300">
                Campos marcados com <span class="text-red-400 font-bold" aria-hidden="true">*</span> são obrigatórios.
            </p>
            <div>
                <label for="email" class="campo-label">E-mail <span class="text-red-400 font-bold" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" required aria-required="true" autocomplete="email"
                       class="campo" placeholder="seu.email@exemplo.com" value="{{ request.form.get('email', '') }}">
            </div>

            <div>
                <label for="senha" class="campo-label">Senha <span class="text-red-400 font-bold" aria-hidden="true">*</span></label>
                <input type="password" id="senha" name="senha" required aria-required="true" autocomplete="current-password"
                       class="campo" placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-cyber-primary btn-grande w-full mt-2 font-bold">
                Entrar na Plataforma
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs">
            <p class="text-slate-400">
                Ainda não tem cadastro?
                <a href="/cadastro" class="text-rose-400 hover:text-rose-300 font-semibold">Cadastre-se gratuitamente</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
