apiVersion: apps/v1
kind: Deployment
metadata:
  name: protejaja-app
  labels:
    app: protejaja
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protejaja
  template:
    metadata:
      labels:
        app: protejaja
    spec:
      containers:
        - name: protejaja
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: SECRET_KEY
              value: "protejaja-eks-prod-2026"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: protejaja-service
spec:
  type: NodePort
  selector:
    app: protejaja
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30080
